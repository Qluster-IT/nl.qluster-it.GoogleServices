<style>
  #settings-form { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
  .setup-actions { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--homey-background-color, #fff); border-top: 1px solid var(--homey-line-color, #ddd); }
  .setup-actions button { width: 100%; margin: 0; }
  form input, form select, form [role="status"], form [role="alert"] { scroll-margin-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
  input[role="switch"] { appearance: none; width: 44px; height: 26px; border: 1px solid var(--homey-line-color, #888); border-radius: 20px; background: var(--homey-color-mono-400, #888); cursor: pointer; vertical-align: middle; }
  input[role="switch"]::before { content: ""; display: block; width: 20px; height: 20px; margin: 2px; border-radius: 50%; background: #fff; }
  input[role="switch"]:checked { background: var(--homey-color-blue, #0082fa); }
  input[role="switch"]:checked::before { transform: translateX(18px); }
  input[role="switch"]:focus-visible { outline: 2px solid var(--homey-color-blue, #0082fa); outline-offset: 3px; }
  input[role="switch"]:disabled { opacity: .5; cursor: default; }
</style>
<form class="homey-form" id="settings-form">
  <fieldset id="settings-fields" disabled style="border:0;margin:0;padding:0">
    <div class="homey-form-group">
      <label class="homey-form-label" for="settings-speaker" data-i18n="speech.default_speaker"></label>
      <select class="homey-form-select" id="settings-speaker"></select>
      <p class="homey-text-small" data-i18n="speech.speaker_help"></p>
      <button class="homey-button-secondary hy-nostyle" type="button" id="settings-reload" data-i18n="speech.reload_speakers"></button>
    </div>
    <div id="settings-inputs"></div>
    <div class="setup-actions">
      <button class="homey-button-primary hy-nostyle" type="submit" data-i18n="speech.continue"></button>
    </div>
  </fieldset>
  <p role="status" id="settings-status"></p>
</form>
<script>
(async () => {
  Homey.setTitle(Homey.__('speech.settings_title'));
  const get = id => document.getElementById('settings-' + id);
  const status = get('status');
  let config;
  try { config = await Homey.emit('get_speech_settings'); }
  catch (error) { status.textContent = error.message; return; }
  const controls = new Map();
  for (const field of config.fields) {
    const group = document.createElement('div');
    group.className = 'homey-form-group';
    const label = document.createElement('label');
    label.className = 'homey-form-label';
    label.htmlFor = 'setting-' + field.id;
    label.textContent = field.label;
    const input = document.createElement(field.type === 'dropdown' ? 'select' : 'input');
    input.id = label.htmlFor;
    if (field.type === 'dropdown') {
      input.className = 'homey-form-select';
      for (const option of field.values) input.add(new Option(option.label, option.id));
      input.value = config.settings[field.id];
    } else {
      input.type = field.type === 'checkbox' ? 'checkbox' : 'number';
      input.className = field.type === 'checkbox' ? '' : 'homey-form-input';
      if (field.type === 'checkbox') {
        input.checked = config.settings[field.id];
        input.setAttribute('role', 'switch');
      }
      else {
        const multiplier = field.labelMultiplier || 1;
        input.value = config.settings[field.id] * multiplier;
        for (const key of ['min', 'max', 'step']) if (field[key] !== undefined) input[key] = field[key] * multiplier;
        input.required = true;
      }
    }
    const hint = document.createElement('p');
    hint.className = 'homey-text-small';
    hint.id = input.id + '-help';
    input.setAttribute('aria-describedby', hint.id);
    hint.textContent = field.hint;
    group.append(label, input, hint);
    get('inputs').append(group);
    controls.set(field.id, input);
  }
  const speaker = get('speaker');
  let choices = [];
  function showSpeakers(selected) {
    speaker.replaceChildren(new Option(Homey.__('speech.no_speaker'), ''));
    for (const [i, choice] of choices.entries()) {
      speaker.add(new Option(`${choice.name}${choice.description ? ' — ' + choice.description : ''}`, String(i),
        false, choice.id === selected?.id));
    }
  }
  if (config.speaker) choices = [config.speaker];
  showSpeakers(config.speaker);
  let busy = false;
  async function perform(action) {
    if (busy) return;
    busy = true;
    get('fields').disabled = true;
    status.textContent = '';
    try { await action(); }
    catch (error) { status.textContent = error.message; status.scrollIntoView({ block: 'nearest' }); }
    finally { get('fields').disabled = false; busy = false; }
  }
  const selected = () => speaker.value === '' ? null : choices[Number(speaker.value)];
  function applyChoices(updated) {
    const previous = selected();
    choices = updated;
    if (previous && !choices.some(choice => choice.id === previous.id)) choices.push(previous);
    showSpeakers(previous);
  }
  get('reload').onclick = () => perform(async () => applyChoices(await Homey.emit('list_speakers', 'force')));
  get('form').onsubmit = event => {
    event.preventDefault();
    if (!get('form').reportValidity()) return;
    perform(async () => {
      const settings = {};
      for (const field of config.fields) {
        const input = controls.get(field.id);
        settings[field.id] = field.type === 'checkbox' ? input.checked
          : field.type === 'number' ? input.valueAsNumber / (field.labelMultiplier || 1) : input.value;
      }
      await Homey.emit('save_speech_settings', { settings, speaker: selected() });
      if (config.next) await Homey.showView(config.next);
      else await Homey.done();
    });
  };
  get('reload').disabled = true;
  try {
    applyChoices(await Homey.emit('list_speakers', 'cached'));
    const updated = await Homey.emit('list_speakers', 'wait');
    if (!busy) applyChoices(updated);
  } catch (error) {
    if (!busy) status.textContent = error.message;
  } finally { get('reload').disabled = false; }
})();
</script>
