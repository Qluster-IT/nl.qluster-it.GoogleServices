<!doctype html>
<html ng-app="uPnPPlayerApp">
    <head>                
        <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
        
        <script type="text/javascript">        
            function l(s)  {
                document.getElementById('debug').value+='\r\n' + (s!==undefined ? s.toString() : 'undefined');
            }

            function onHomeyReady(Homey) {
                var save = document.getElementById('save');
                var cloudJSON = document.getElementById('cloudJSON');
                Homey.ready();
                save.onclick = function() {
                    Homey.alert(cloudJSON.value);
                    Homey.set('CloudJSON', cloudJSON.value);
                }
                Homey.get('CloudJSON', function(err, v) {
                    cloudJSON.value = err ? '' : v;
                });                
            }

        </script>
    </head>

    <body ng-controller="UPnPPlayerAppController as upnp">        
        <textarea id="debug" type="text" columns="40" rows="5" style="width:100%;display: none;"></textarea>

        <h2>Google Cloud Service Account JSON</h2>
        <textarea id="cloudJSON" type="text" columns="40" rows="10" style="width:100%;"></textarea>

        <button id="save" onclick="">Save</button>

</body>
</html>
